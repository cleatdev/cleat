name: publish-gateway

# Build and push the MULTI-ARCH egress gateway image to ghcr.io
# (EGRESS-SPEC.md 8.0). The CLI pins it by index digest in _GATEWAY_IMAGE and
# never by tag, so the tags pushed here are for people reading the registry.
#
# Same shape as publish-image.yml: each platform builds natively and pushes by
# digest, then a merge job assembles one manifest. The image is small (Python
# on distroless), so this is minutes, not the box image's half hour.
#
# INVARIANT, inverted from the box image (rule GW1 of 8.8): the final image
# MUST carry sh.cleat.role=gateway and MUST NOT carry sh.cleat.version. The
# role label is what makes a superseded gateway image reclaimable, and a
# version label would make cleat storage and the prune paths treat the gateway
# as a box image. The merge job fails the publish on either.
#
# Triggers: a push to the gateway-publish branch (the image can be published
# before the CLI that uses it is released), a gateway-v* tag, or by hand.
on:
  push:
    branches: [gateway-publish]
    tags: ['gateway-v*']
    paths:
      - 'docker/gateway/**'
      - '.github/workflows/publish-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cleatdev/cleat-gw

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/gateway
          file: docker/gateway/Dockerfile
          platforms: ${{ matrix.platform }}
          # The role label is set in the Dockerfile too. Stated here so the
          # image cannot lose it to a Dockerfile edit without this file saying so.
          labels: |
            sh.cleat.role=gateway
            org.opencontainers.image.source=https://github.com/cleatdev/cleat
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: gw-digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifests & tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: gw-digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        run: |
          # spec-<N> names the contract the CLI compares (_GATEWAY_SPEC_VERSION);
          # sha-<short> names the exact build. No latest: nothing should pull
          # this image by a floating name.
          SPEC="$(grep -E '^_GATEWAY_SPEC_VERSION=' bin/cleat 2>/dev/null | head -1 | grep -oE '[0-9]+' | head -1 || true)"
          echo "spec=${SPEC:-1}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$REGISTRY/$IMAGE_NAME:spec-${{ steps.meta.outputs.spec }}" \
            -t "$REGISTRY/$IMAGE_NAME:sha-${{ steps.meta.outputs.short }}" \
            $(printf "$REGISTRY/$IMAGE_NAME@sha256:%s " *)

      - name: Verify manifest covers both architectures
        run: |
          # GHCR is read-after-write lagged (the v1.4.3 box image publish failed
          # here once with the manifest already pushed). Retry for about a minute.
          REF="$REGISTRY/$IMAGE_NAME:sha-${{ steps.meta.outputs.short }}"
          for i in 1 2 3 4 5 6; do
            docker buildx imagetools inspect "$REF" > /tmp/manifest && break
            sleep 10
          done
          cat /tmp/manifest
          grep -q 'linux/amd64' /tmp/manifest
          grep -q 'linux/arm64' /tmp/manifest

      - name: Verify the role label is present and the version label is absent
        run: |
          REF="$REGISTRY/$IMAGE_NAME:sha-${{ steps.meta.outputs.short }}"
          for i in 1 2 3 4 5 6; do
            docker buildx imagetools inspect "$REF" --format '{{ json .Image }}' > /tmp/configs && break
            sleep 10
          done
          cat /tmp/configs
          # The inspect output is pretty-printed, so the space after the colon varies.
          grep -Eq '"sh\.cleat\.role": *"gateway"' /tmp/configs
          if grep -q 'sh.cleat.version' /tmp/configs; then
            echo "::error::the gateway image carries sh.cleat.version (rule GW1)"; exit 1
          fi

      - name: Print the index digest to pin in _GATEWAY_IMAGE
        run: |
          REF="$REGISTRY/$IMAGE_NAME:sha-${{ steps.meta.outputs.short }}"
          DIGEST="$(docker buildx imagetools inspect "$REF" --format '{{ json .Manifest }}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          echo "_GATEWAY_IMAGE=\"$REGISTRY/$IMAGE_NAME@$DIGEST\"" | tee -a "$GITHUB_STEP_SUMMARY"
