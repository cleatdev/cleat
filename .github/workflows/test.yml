name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only need to read the repo. No write access for CI.
permissions:
  contents: read

# Cancel in-progress runs for the same ref, avoid wasting minutes on
# superseded pushes. For main branch, this rarely fires.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Static analysis: shellcheck (advisory, does not block merge) ─────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint bin/cleat (errors only)
        run: shellcheck --severity=error --shell=bash bin/cleat
      - name: Lint docker/entrypoint.sh (errors only)
        run: shellcheck --severity=error --shell=bash docker/entrypoint.sh
      - name: Lint install.sh (errors only)
        run: shellcheck --severity=error --shell=bash install.sh

  # ── Full test suite on Linux ──────────────────────────────────────────────
  # Suite and mutation output goes to a file, then cat. The runner holds a step
  # open until every process sharing its output pipe exits, so a single test
  # straggler (a backgrounded watcher losing a kill race) used to stall the
  # step for minutes after the suite passed; a 2026-07-14 run blew the job
  # timeout that way with the suite green. A straggler holding a plain file
  # blocks nobody. Costs live streaming, buys deterministic step exit.
  test-linux:
    name: test (ubuntu, bash 5.x)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install inotify-tools (exercise the inotifywait watcher branch)
        # The Linux leg runs the suite with inotifywait present so the event
        # branch of _clipboard_watcher is really executed; the macOS leg has
        # neither inotifywait nor fswatch and keeps covering the polling
        # fallback. Together the matrix exercises both watch paths.
        run: sudo apt-get update && sudo apt-get install -y inotify-tools
      - name: Bash version
        run: bash --version
      - name: Run full BATS suite
        run: |
          rc=0; ./test.sh > "$RUNNER_TEMP/suite.log" 2>&1 < /dev/null || rc=$?
          cat "$RUNNER_TEMP/suite.log"; exit "$rc"

  # ── Full test suite on the OLDER Ubuntu (bash 5.1 / GNU coreutils 8.x) ──────
  # Every other Linux leg pins ubuntu-latest (24.04: bash 5.2, coreutils 9.4).
  # coreutils 9 changed real behaviours in tools Cleat shells out to (cp, du,
  # stat, df), and a large share of hosts and self-hosted CI still run 22.04
  # (bash 5.1.16, coreutils 8.32, in standard support to Apr 2027). Gating: same
  # suite, stock runner, exercises the GNU side at a second coreutils version.
  test-linux-2204:
    name: test (ubuntu 22.04, bash 5.1)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install inotify-tools (exercise the inotifywait watcher branch)
        run: sudo apt-get update && sudo apt-get install -y inotify-tools
      - name: Bash and coreutils versions
        run: bash --version | head -1; cp --version | head -1
      - name: Run full BATS suite
        run: |
          rc=0; ./test.sh > "$RUNNER_TEMP/suite.log" 2>&1 < /dev/null || rc=$?
          cat "$RUNNER_TEMP/suite.log"; exit "$rc"

  # ── Mutation harness, its OWN job on purpose ────────────────────────────────
  # It used to run as a second step inside test-linux. The suite alone reached
  # 18m18s against that job's 20-minute cap, so every test added to the suite
  # pushed CI toward timing out before it could catch anything. Splitting also
  # runs the two in parallel, which cuts total wall clock rather than adding to
  # it. The harness must never run concurrently with another copy of itself: it
  # mutates bin/cleat in place and restores from a backup on exit.
  mutation-linux:
    name: mutation (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Bash version
        run: bash --version
      - name: Mutation test the regression registry
        run: |
          rc=0; ./test/mutation_regressions.sh > "$RUNNER_TEMP/mutation.log" 2>&1 < /dev/null || rc=$?
          cat "$RUNNER_TEMP/mutation.log"; exit "$rc"

  # ── Full test suite on macOS via /bin/bash (bash 3.2, catches bash 4+ bugs) ─
  # macOS ships both /bin/bash (Apple's 3.2.57, unchanged since 2009 due to the
  # bash 4 GPLv3 switch) and Homebrew bash 5. We run the suite through /bin/bash
  # explicitly so we're actually testing the version real macOS users have as
  # default. Bash 3.2 compatibility is a hard project invariant.
  #
  # Pinned to macos-15 (not macos-latest) on purpose. GitHub is migrating the
  # `macos-latest` label to macOS 26 over Jun 15–Jul 15 2026, gradually, so the
  # `latest` label would run this canary on a mix of OS images during the
  # rollout. Pinning keeps the bash-3.2 canary deterministic; macos-15 is
  # supported for ~a year. Revisit (bump to macos-26 or back to latest) once the
  # migration settles. The 3.2.x assertion below is the backstop either way.
  test-macos-bash32:
    name: test (macos, bash 3.2)
    runs-on: macos-15
    # Suite + fork-copy only (no mutation harness on macOS, see the note below).
    # 90, not 35/60: GitHub's macOS runners are extremely variable. The same suite
    # step that finishes in ~15 min on a fresh runner took >60 min on a contended
    # one on 2026-08-21 (~12x the ~5-min local time, process-spawn bound: 2177
    # tests, most spawning the CLI as a subprocess). It is slow, not hung (it
    # passes whole on a normal runner), so a generous cap is the pragmatic fix for
    # infra variability. The fork step's `brew install coreutils` is fail-safe
    # (skips if unavailable) and never fails this gating leg. A truly pathological
    # runner past 90 min is rare; re-run. Parallelising the suite (bats --jobs,
    # needs GNU parallel + parallel-safe tests) is the deeper fix if this recurs.
    timeout-minutes: 90
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Bash version (must be 3.2)
        run: |
          bash --version
          /bin/bash --version
          /bin/bash -c 'echo "BASH_VERSION=$BASH_VERSION"' | grep -E '^BASH_VERSION=3\.2\.' \
            || { echo "Expected /bin/bash to be 3.2.x"; exit 1; }
      - name: Diagnostic, verify cleat binary runs on bash 3.2
        run: |
          export HOME=/tmp/cleat-diag
          export XDG_CONFIG_HOME=/tmp/cleat-diag-xdg
          mkdir -p "$HOME/.claude" "$XDG_CONFIG_HOME/cleat"
          export PATH="$(pwd)/test/fixtures/mock_bin:$PATH"
          export DOCKER_CALLS=/tmp/docker_calls DOCKER_MOCK_DIR=/tmp/docker_mock
          touch "$DOCKER_CALLS"; mkdir -p "$DOCKER_MOCK_DIR"
          echo "=== cleat --help ==="
          /bin/bash bin/cleat --help 2>&1 | head -5 || echo "EXIT: $?"
          echo "=== cleat config --enable git ==="
          /bin/bash bin/cleat config --enable git 2>&1 || echo "EXIT: $?"
          echo "=== cleat config --enable git (trace last 20) ==="
          /bin/bash -x bin/cleat config --enable git 2>&1 | tail -20 || echo "EXIT: $?"
          echo "=== which timeout ==="
          which timeout 2>&1 || echo "timeout not found"
          echo "=== locale ==="
          locale 2>&1 || true
      - name: Run full BATS suite via /bin/bash
        run: |
          rc=0; /bin/bash ./test.sh > "$RUNNER_TEMP/suite.log" 2>&1 < /dev/null || rc=$?
          cat "$RUNNER_TEMP/suite.log"; exit "$rc"

      # ── The Homebrew-coreutils macOS profile ────────────────────────────────
      # Plenty of macOS developers put GNU coreutils ahead of the system tools
      # (`brew install coreutils` plus gnubin on PATH). That host is Darwin but
      # has GNU cp, which rejects -c with "invalid option". Any code that picks
      # tool flags from `uname -s` breaks for exactly that profile, which is why
      # the fork copy probes the cp BINARY instead. Nothing else in CI covers
      # this combination: the ubuntu legs are GNU-on-Linux and the macOS legs
      # are BSD-on-Darwin, so GNU-on-Darwin only exists here.
      - name: Fork copy under GNU coreutils on macOS
        run: |
          brew install coreutils >/dev/null 2>&1 || true
          GNUBIN="$(brew --prefix)/opt/coreutils/libexec/gnubin"
          if [ ! -d "$GNUBIN" ]; then echo "gnubin not present, skipping"; exit 0; fi
          export PATH="$GNUBIN:$PATH"
          echo "cp is now: $(command -v cp)"
          cp --version | head -1
          rc=0; /bin/bash ./test/bats/bin/bats test/unit/fork.bats > "$RUNNER_TEMP/fork-gnu.log" 2>&1 < /dev/null || rc=$?
          cat "$RUNNER_TEMP/fork-gnu.log"; exit "$rc"

  # NOTE: there is deliberately no macOS mutation-harness job. The harness gates
  # on Linux (mutation-linux, GNU sed, 568/568). Running it on macOS additionally
  # requires every mutation sed to be BSD-sed portable, and a completed macOS run
  # (2026-08-21, once the suite/harness were split so it no longer timed out
  # mid-flight) surfaced ~8 pre-existing seds that catch on GNU but miss/skip on
  # BSD sed. Fixing those needs BSD-sed iteration and is tracked as a follow-up;
  # until then a macOS mutation leg would be permanently red. Developers on macOS
  # should know `./test/mutation_regressions.sh` will misreport those entries
  # locally under BSD sed (the header of that script lists the caveat).

  # ── macOS Intel ─────────────────────────────────────────────────────────────
  # macos-15 (above) is Apple Silicon. Cleat's documented host matrix includes
  # Intel Macs, and nothing else exercises them: the arch differences that have
  # cost releases before were base-image ones (an arm64 box needed libicu72 that
  # amd64 already had). Suite only, no mutation harness: the harness is covered
  # on two runners already and this leg is about arch, not about test depth.
  # runs-on is macos-15-intel, NOT macos-13: GitHub retired the macos-13 image on
  # 2025-12-04, so a job pinned to it never gets a runner and sits queued for the
  # 24h max before being cancelled (exactly what this leg did from the day it was
  # added). macos-15-intel is the LAST x86_64 Actions image, available until
  # August 2027, after which Apple's Intel drop retires this leg for good.
  # ── Intel-mac bash 3.2 BOOT check (gating) ─────────────────────────────────
  # This used to run the full BATS suite, but the mock suite builds no image and
  # starts no daemon, so x86_64 vs arm64 is invisible to it: the full bash-3.2
  # suite already gates on test-macos-bash32 (Apple Silicon). This leg's unique,
  # non-nil signal is "the CLI parses and boots under x86_64 /bin/bash 3.2". It is
  # a fast boot check because GitHub's Intel-mac runner pool is scarce and being
  # retired, and the multi-minute suite step here was repeatedly reclaimed mid-run
  # (cancelled), making a gating leg flaky. A seconds-long step shrinks that window.
  test-macos-intel:
    name: boot (macos intel, bash 3.2)
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Bash version and arch
        run: /bin/bash --version | head -1; uname -m
      - name: The CLI boots under Intel /bin/bash 3.2 (no daemon needed)
        run: /bin/bash bin/cleat --version && /bin/bash bin/cleat --help >/dev/null

  # ── Newest-macOS bash 3.2 canary (ADVISORY) ────────────────────────────────
  # The gating bash-3.2 legs pin macos-15 for a deterministic canary. This leg
  # tracks macos-latest (macOS 26+) for one reason: to catch a future macOS that
  # changes or drops the /bin/bash 3.2.57 the CLI depends on BEFORE macos-15 is
  # retired. Advisory: the day Apple ships a macOS without bash 3.2 this goes red
  # as a heads-up, never a block. Smoke-only to keep the newest-OS runner cheap.
  macos-latest-canary:
    name: bash 3.2 canary (macos-latest)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Assert /bin/bash is still 3.2.x
        run: |
          v="$(/bin/bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')"
          echo "/bin/bash on $(sw_vers -productVersion): $v"
          case "$v" in
            3.2) echo "bash 3.2 present" ;;
            *) echo "::warning::/bin/bash is $v, not 3.2 - the macOS default shell moved"; exit 1 ;;
          esac
      - name: The CLI boots under the newest-macOS /bin/bash 3.2
        # A boot check, not the BATS suite: smoke.bats expects the Docker stub in
        # PATH (set up by ./test.sh), which a bare bats invocation lacks, and the
        # canary's point is the bash-3.2 presence above plus "the CLI still parses
        # and boots on the newest macOS". --version/--help touch no daemon.
        run: /bin/bash bin/cleat --version && /bin/bash bin/cleat --help >/dev/null

  # ── Integration tests against real Docker (Linux only, runners have it) ──
  test-integration:
    name: integration (real docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-linux
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify docker available
        run: docker version
      - name: Run integration suite
        run: ./test/integration/run.sh


  # ── Linux arm64: suite + real-Docker integration, built and run natively ────
  # Cleat's documented host matrix includes Apple Silicon and arm64 Linux and
  # the image is multi-arch, but nothing in CI ever BUILT or RAN it on arm64.
  # The base is pinned by the node:24-bookworm-slim multi-arch OCI *index* digest
  # (docker/Dockerfile), so `docker build` on an arm64 host resolves the arm64
  # sub-manifest automatically. That is the prize: arch-specific base-image bugs
  # (an arm64 box once needed libicu72 that amd64 already had) only surface when
  # the image is really built and run on arm. The ubuntu-24.04-arm partner image
  # ships Docker preinstalled with the daemon already running, exactly like the
  # x64 ubuntu runners, so run.sh's `docker info` probe passes and the
  # integration suite runs instead of skipping cleanly. Free on public repos
  # (arm64 public-repo runners, 4 vCPU). Suite first (file-redirected to reclaim
  # watcher-straggler dead-air, see test-linux), then integration built + run
  # natively. inotify-tools installed so the arm leg also exercises the
  # inotifywait event branch of the watcher, mirroring test-linux. No mutation
  # harness here: like the intel leg this job is about arch, not test depth, and
  # mutation is already covered on two runners.
  test-linux-arm64:
    name: test (ubuntu arm64, bash 5.x)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Bash version and arch
        run: bash --version | head -1; uname -m
      - name: Install inotify-tools (exercise the inotifywait watcher branch)
        run: sudo apt-get update && sudo apt-get install -y inotify-tools
      - name: Run full BATS suite
        run: |
          rc=0; ./test.sh > "$RUNNER_TEMP/suite.log" 2>&1 < /dev/null || rc=$?
          cat "$RUNNER_TEMP/suite.log"; exit "$rc"
      - name: Verify docker available
        run: docker version
      - name: Run integration suite (builds and runs the arm64 cleat image)
        run: ./test/integration/run.sh

  # ── Windows + WSL2 (Ubuntu) ─────────────────────────────────────────────────
  # WSL2 is a documented supported host (the CLAUDE.md matrix) yet nothing else
  # in CI touches it. This leg checks the tree out on the Windows side, then runs
  # the BATS suite INSIDE a WSL2 Ubuntu distro over the /mnt drvfs mount, which is
  # exactly how a real Cleat-on-WSL2 user reaches the source. It catches the
  # failures that only surface there: CRLF-corrupted scripts, /mnt path
  # translation, Windows<->Linux interop, and whatever coreutils/bash the distro
  # ships (Ubuntu-24.04 → GNU coreutils + bash 5.x).
  #
  # No real Docker daemon is needed: the suite runs against the mock docker stub
  # (test/fixtures/mock_bin/docker), so this is a pure portability leg. The
  # mutation harness and real-Docker integration are intentionally skipped
  # (covered on the ubuntu/macos legs already), the same scope call as the intel
  # leg: this job is about the WSL runtime, not test depth.
  windows-wsl2:
    name: test (windows, wsl2 ubuntu)
    runs-on: windows-latest
    timeout-minutes: 45
    # Green, but kept advisory: WSL2 provisioning on windows-2025 has a known
    # intermittent per-user issue (actions/runner-images#14499); do not gate the
    # board on it until it has a longer green streak.
    continue-on-error: true
    steps:
      # MUST precede checkout. GitHub's Windows git defaults core.autocrlf on, so
      # checkout would rewrite every LF script to CRLF. A stray \r breaks bash
      # shebangs and string compares inside WSL, so pin LF before cloning.
      - name: Preserve LF line endings across the Windows checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # setup-wsl@v7 installs + provisions the distro and drops a `wsl-bash`
      # wrapper usable as a step shell (it runs `bash --noprofile --norc -euo
      # pipefail {0}` as root). Default distro is Debian-13; force Ubuntu-24.04,
      # the documented WSL host. git is added because the minimal WSL Ubuntu
      # rootfs ships without it and test.sh falls back to `git submodule update`
      # if the BATS submodule is ever missing.
      - name: Set up WSL2 with Ubuntu
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          # jq: the minimal WSL Ubuntu rootfs ships without it, and the CLI's
          # host-side .claude.json merge + hooks overlay are jq-gated; the other
          # runners preinstall jq, which hid the dependency. git: submodule
          # fallback insurance (the Windows-side checkout already populates BATS).
          additional-packages: git jq
      # wsl-bash starts in root's HOME, NOT the workspace, and $RUNNER_TEMP is a
      # Windows path unusable here. cd via wslpath: `github.workspace` expands to
      # the Windows path (e.g. D:\a\cleat\cleat) before the script reaches WSL,
      # and wslpath maps it to /mnt/d/a/cleat/cleat.
      - name: Environment (inside WSL2)
        shell: wsl-bash {0}
        run: |
          uname -a
          bash --version | head -1
          cd "$(wslpath '${{ github.workspace }}')"
          echo "REPO=$PWD"
          git config --global --add safe.directory '*' || true
          ls -la | head -20
      # `bash ./test.sh` (not `./test.sh`): /mnt drvfs mounts default to
      # metadata-off, so the exec bit is unreliable there; invoking bash directly
      # sidesteps it. Log to a WSL-local path and cat at the end, mirroring the
      # file-redirect convention (RUNNER_TEMP is a Windows path in WSL, so /tmp).
      - name: Run full BATS suite inside WSL2 (mock docker, no real daemon)
        shell: wsl-bash {0}
        run: |
          cd "$(wslpath '${{ github.workspace }}')"
          rc=0; bash ./test.sh > /tmp/suite.log 2>&1 < /dev/null || rc=$?
          cat /tmp/suite.log; exit "$rc"

  # ── Colima on macOS (alternate Docker engine, real integration) ─────────────
  # docker-autopilot targets Docker Desktop, OrbStack, Colima and rootless, but CI
  # only ever exercised the ubuntu Docker daemon. This leg starts Colima (Lima VM +
  # dockerd) and runs the REAL integration suite against it, so an engine other than
  # "the Linux runner's daemon" is genuinely tested.
  #
  # runs-on is macos-15-intel, NOT macos-15. macos-15 is Apple Silicon (arm64) and
  # GitHub's arm64 runners cannot nest a VM: Apple's Virtualization.framework only
  # gained nested virtualization on M3 under macOS 15 and GitHub has not enabled it,
  # while the M1 class has no hardware support at all. Colima therefore cannot start
  # a daemon on macos-15. The only free GitHub-hosted label where Colima works today
  # is macos-15-intel (x86_64), which is exactly what Colima's own CI and the
  # douglascamata/setup-docker-macos-action use. macos-15-intel lives until Aug 2027
  # (Apple Intel drop). Revisit an arm64 Colima leg once GitHub enables nested virt
  # on M3+ runners.
  #
  # continue-on-error while it proves itself: Colima bring-up (VM boot + the virtiofs
  # home mount that Cleat's bind mounts ride on) is the slow, occasionally-flaky part,
  # and a red experimental engine leg must not gate merges. Promote to blocking after
  # a few weeks green.
  #
  # The explicit "docker info" gate is load-bearing: test/integration/run.sh SKIPS
  # (exit 0) when the daemon is unreachable, so without a hard gate a failed Colima
  # bring-up would go GREEN having tested nothing. We fail loudly instead.
  colima-macos:
    name: integration (colima, macos intel)
    runs-on: macos-15-intel
    timeout-minutes: 40
    needs: test-linux
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Colima and the Docker CLI
        # Docker Desktop is not on the macOS runners, so the docker CLI must be
        # installed. brew resolves lima as a colima dependency.
        run: |
          rc=0; brew install colima docker > "$RUNNER_TEMP/brew.log" 2>&1 < /dev/null || rc=$?
          cat "$RUNNER_TEMP/brew.log"; exit "$rc"
      - name: Start Colima (Docker runtime) and let dockerd settle
        # colima start registers and activates the "colima" docker context, so the
        # docker CLI needs no DOCKER_HOST wiring. The sleep mirrors Colima's own CI:
        # it avoids a race where the socket exists before dockerd is accepting calls.
        run: |
          rc=0
          { colima start --runtime docker --cpu 3 --memory 6 && sleep 10; } \
            > "$RUNNER_TEMP/colima.log" 2>&1 < /dev/null || rc=$?
          cat "$RUNNER_TEMP/colima.log"; exit "$rc"
      - name: Verify the daemon is really up (run.sh silently skips otherwise)
        run: |
          rc=0
          { docker context show; docker ps; docker info; } \
            > "$RUNNER_TEMP/dockerinfo.log" 2>&1 < /dev/null || rc=$?
          cat "$RUNNER_TEMP/dockerinfo.log"; exit "$rc"
      - name: Run integration suite against Colima
        run: |
          # Colima's Lima VM shares $HOME into the guest but NOT the macOS default
          # TMPDIR (/var/folders). The integration tests mktemp -d their project
          # dir (test/setup.bash TEST_TEMP), so under the default TMPDIR cleat's
          # -v project:/workspace bind lands EMPTY inside the VM and every
          # box-creating test fails (the documented "unshared path mounts empty on
          # macOS" trap). Point TMPDIR under $HOME so the project + config dirs are
          # inside the shared scope.
          export TMPDIR="$HOME/colima-tmp"; mkdir -p "$TMPDIR"
          # The integration tests isolate $HOME, which hides Colima's docker
          # context (it lives under the real ~/.docker). Point DOCKER_HOST at
          # Colima's forwarded socket explicitly so cleat's engine-aware docker
          # cap resolves + binds it regardless of the test's HOME.
          export DOCKER_HOST="unix://$HOME/.colima/default/docker.sock"
          rc=0; ./test/integration/run.sh > "$RUNNER_TEMP/integration.log" 2>&1 < /dev/null || rc=$?
          cat "$RUNNER_TEMP/integration.log"; exit "$rc"

  # ── Integration tests against a ROOTLESS Docker daemon (Linux only) ──────────
  # The existing test-integration job runs against the runner's stock ROOTFUL
  # daemon at /var/run/docker.sock. Rootless is a different engine leg entirely:
  # the daemon runs in a user namespace and its socket lives at
  # unix:///run/user/<uid>/docker.sock. Cleat's docker cap mounts the socket and
  # the autopilot brings the daemon up, both of which have only ever been
  # unit-mocked for rootless. This is the first real rootless daemon in CI.
  #
  # continue-on-error is deliberate while this leg beds in. Rootless bring-up on
  # a hosted runner is finicky (AppArmor userns restriction on 24.04, no user
  # systemd session by default, socket-path assumptions in cleat) and a genuine
  # cleat gap here should surface as a signal, not block every merge. Flip it to
  # blocking once it has proven stable across a few runs.
  integration-rootless:
    name: integration (rootless docker)
    runs-on: ubuntu-latest        # ubuntu-latest == ubuntu-24.04 (Aug 2026)
    timeout-minutes: 20
    needs: test-linux             # mirror test-integration: don't burn the finicky
                                  # bring-up if the behavior layer is already red
    continue-on-error: true       # provisional: see banner above
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Everything the rootless daemon needs, then the daemon itself. Verbose
      # apt/setuptool output goes to a file and is cat'd once (the dead-air
      # convention). The socket/host env is exported to $GITHUB_ENV at the end so
      # the verify + run steps below inherit it.
      - name: Set up rootless Docker (dockerd-rootless-setuptool.sh)
        run: |
          rc=0
          {
            set -x
            # 1. Rootless prerequisites. The hosted runner ships docker-ce but
            #    WITHOUT download.docker.com in its apt sources, so
            #    docker-ce-rootless-extras (the sole provider of rootlesskit,
            #    dockerd-rootless.sh and dockerd-rootless-setuptool.sh) has "no
            #    installation candidate". Register the repo + key FIRST, then
            #    install. uidmap gives newuidmap/newgidmap; dbus-user-session +
            #    slirp4netns are needed for the user systemd manager + networking.
            sudo install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
              | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            sudo chmod a+r /etc/apt/keyrings/docker.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
              | sudo tee /etc/apt/sources.list.d/docker.list
            sudo apt-get update
            sudo apt-get install -y uidmap dbus-user-session slirp4netns docker-ce-rootless-extras
            # Fail HERE at the real point if the extras did not land, instead of
            # letting the rc-capture swallow it and reddening a step later.
            command -v dockerd-rootless-setuptool.sh >/dev/null \
              || { echo "docker-ce-rootless-extras did not install"; exit 1; }

            # 2. Ensure subuid/subgid ranges exist for the runner user. Hosted
            #    runners normally have these, but a missing range is a hard
            #    setuptool failure, so backfill defensively.
            grep -q "^$(whoami):" /etc/subuid || echo "$(whoami):100000:65536" | sudo tee -a /etc/subuid
            grep -q "^$(whoami):" /etc/subgid || echo "$(whoami):100000:65536" | sudo tee -a /etc/subgid

            # 3. Ubuntu 24.04 sets kernel.apparmor_restrict_unprivileged_userns=1,
            #    which blocks rootlesskit from creating user namespaces
            #    ("fork/exec /proc/self/exe: permission denied"). The extras deb
            #    ships a profile, but relaxing the sysctl is the reliable CI fix
            #    and is harmless on kernels without the key.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

            # 4. Prove we're really on rootless: disable the rootful daemon so the
            #    integration suite cannot silently fall through to /var/run/docker.sock.
            sudo systemctl disable --now docker.service docker.socket || true
            sudo rm -f /var/run/docker.sock || true

            # 5. Hosted runners have no lingering systemd --user session and no
            #    XDG_RUNTIME_DIR. Enable linger so user@<uid>.service comes up, then
            #    point the user-scoped tooling at its runtime dir + bus.
            sudo loginctl enable-linger "$(whoami)"
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
            for _ in $(seq 1 30); do [ -S "${XDG_RUNTIME_DIR}/bus" ] && break; sleep 1; done

            # 6. Install and start the rootless daemon. --force ignores any leftover
            #    rootful socket; --skip-iptables avoids a hard failure on the
            #    runner's iptables setup. Both are real setuptool flags.
            dockerd-rootless-setuptool.sh install --force --skip-iptables
            systemctl --user enable --now docker
            for _ in $(seq 1 30); do [ -S "${XDG_RUNTIME_DIR}/docker.sock" ] && break; sleep 1; done

            # 7. Hand the rootless socket to every later step in this job.
            {
              echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}"
              echo "DBUS_SESSION_BUS_ADDRESS=unix:path=${XDG_RUNTIME_DIR}/bus"
              echo "DOCKER_HOST=unix://${XDG_RUNTIME_DIR}/docker.sock"
            } >> "$GITHUB_ENV"
          } > "$RUNNER_TEMP/rootless-setup.log" 2>&1 < /dev/null || rc=$?
          cat "$RUNNER_TEMP/rootless-setup.log"; exit "$rc"

      # Confirm the daemon answering DOCKER_HOST is genuinely rootless, not the
      # rootful one leaking through. SecurityOptions carries name=rootless.
      - name: Verify rootless daemon
        run: |
          echo "DOCKER_HOST=$DOCKER_HOST"
          docker version
          docker info -f '{{.SecurityOptions}}' | grep -q 'name=rootless' \
            || { echo "Daemon is not rootless"; docker info; exit 1; }

      # Cleat's own entry point. run.sh self-skips if the daemon is unreachable,
      # so a bring-up that half-failed degrades to a skip rather than a false red.
      - name: Run integration suite against the rootless daemon
        run: |
          rc=0; ./test/integration/run.sh > "$RUNNER_TEMP/integration-rootless.log" 2>&1 < /dev/null || rc=$?
          cat "$RUNNER_TEMP/integration-rootless.log"; exit "$rc"
